server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # Vue SPA 带哈希的资源(vite build → assets/),长缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        access_log off;
    }

    # Django collectstatic 输出(admin CSS/JS 等)
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        access_log off;
    }

    # 用户上传媒体
    location /media/ {
        alias /usr/share/nginx/media/;
    }

    # DRF API → Django(gunicorn)
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Django admin(SSR 管理后台,可选)
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由兜底:未匹配路径返回 index.html(Vue Router history 模式)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
